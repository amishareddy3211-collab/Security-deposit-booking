<title>Security Deposit - Secure Payment Gateway</title>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#eef1f6;display:flex;justify-content:center;padding:12px}
.main{max-width:440px;width:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.12)}
.top{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:22px;text-align:center}
.badge{background:#22c55e;color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block;margin-top:8px}
.card{padding:16px}
.alert{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:14px;margin-bottom:14px}
.price{text-align:center;margin:12px 0;padding:14px;background:#f8fafc;border-radius:14px;border:1px solid #e2e8f0}
.qr-wrap{background:#fff;border:2px dashed #94a3b8;border-radius:18px;padding:18px;text-align:center;margin:14px 0}
.qr{width:220px;height:220px;background:#fff;padding:8px;border-radius:12px;margin:0 auto;display:block;border:1px solid #e2e8f0;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px;font-size:14px}
.btn-dark{background:#0f172a;color:#fff}
.btn-blue{background:#2563eb;color:#fff}
.btn-green{background:#16a34a;color:#fff}

.btn-light{background:#f1f5f9;color:#0f172a;border:1px solid #e2e8f0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.pbtn{border:2px solid #e2e8f0;border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;background:#fff;font-weight:800;font-size:12px}
.inp{width:100%;padding:13px;border:1.5px solid #cbd5e1;border-radius:10px;margin:8px 0;background:#fff;font-size:14px}
.upload{border:2px dashed #94a3b8;background:#f8fafc;border-radius:12px;padding:16px;text-align:center;cursor:pointer;margin:10px 0}
.hidden{display:none!important}
.row{display:flex;gap:8px}
.small{font-size:11px;color:#64748b}
.progress{display:flex;justify-content:center;gap:10px;padding:12px;background:#f8fafc}
